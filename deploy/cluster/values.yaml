# Control-plane replicas. Keep 1 unless Redis is reachable from every pod:
# SSE and worker job offers then fan out over Redis Pub/Sub (lossy; clients
# reconnect and the final message snapshot is in Postgres). Redis outage
# degrades each pod to in-process delivery, which is the single-replica path.
# Workspace file RPC still needs the pod that holds that Worker WebSocket.
replicaCount: 1

namespace: kross

images:
  # Optional registry prefix, e.g. ghcr.io/zzc-101. Leave empty for local tags.
  registry: ""
  server: kross-server:local
  web: kross-web:local
  worker: kross-worker:local
  pullPolicy: IfNotPresent
  pullSecrets: []

ingress:
  enabled: true
  className: traefik
  host: ""
  tls: false
  tlsSecretName: ""
  annotations: {}

secrets:
  postgresPassword: changeme
  credentialMasterKey: changeme-credential-master-key-32b
  s3AccessKey: kross
  s3SecretKey: changeme-s3-secret

app:
  externalBaseUrl: http://localhost
  publicBaseUrl: http://server:8787
  # Browser-reachable RustFS/S3 URL used in presigned PUT/GET. Empty uses
  # rustfs.ingress.host when that Ingress is enabled, otherwise localhost
  # port-forward: `kubectl port-forward svc/rustfs 9000:9000`.
  s3PublicEndpoint: ""
  workerRuntime: kubernetes
  workerStorage: juicefs
  cacheEnabled: true
  storageClass: kross-juicefs
  workspaceSize: 10Gi
  # Worker Pod requests/limits. 2000m will not schedule on 2-core k3s nodes
  # that already run kubelet and CSI.
  agentCpuMillis: 500
  agentMemoryBytes: 536870912
  # Optional scheduler tick override in milliseconds. Empty keeps 5000.
  schedulerPollMs: ""
  # Optional Worker Pod nodeSelector, e.g. kubernetes.io/hostname: worker-1
  workerNodeSelector: {}

postgres:
  image: pgvector/pgvector:pg17
  persistence:
    size: 20Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []

rustfs:
  image: rustfs/rustfs:1.0.0
  persistence:
    size: 40Gi
    storageClass: ""
  nodeSelector: {}
  tolerations: []
  # Host-based Ingress for browser presigned PUT/GET. Do not put this on the
  # workbench host: S3 path-style URLs occupy `/`.
  ingress:
    enabled: false
    host: ""
    className: ""
    tls: false
    tlsSecretName: ""
    annotations: {}

redis:
  image: redis:7-alpine
  nodeSelector: {}
  tolerations: []

server:
  nodeSelector: {}
  tolerations: []

web:
  nodeSelector: {}
  tolerations: []

juicefs:
  volumeName: kross-work
  metaDatabase: kross_jfs
  bucket: kross-jfs
  # Official JuiceFS CLI image. Format also creates this S3 bucket if missing.
  formatImage: juicedata/mount:ce-v1.4.1

rbac:
  # Dashboard node list. Disable if the cluster forbids listing Node objects.
  listNodes: true

knowledge:
  enabled: false
  image: kross-knowledge:local
  internalToken: ""
  embeddingProvider: auto
  embeddingBaseUrl: ""
  embeddingApiKey: ""
  embeddingSize: 2b
  embeddingModel: ""
  embeddingDim: 0
  embeddingModelDir: ""
  embeddingHub: huggingface
  embeddingDevice: auto
  nodeSelector: {}
  tolerations: []

feishu:
  enabled: false
  appId: ""
  appSecret: ""
  verificationToken: ""
  encryptKey: ""
