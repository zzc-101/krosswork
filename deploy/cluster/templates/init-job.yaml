{{- /*
  Regular Job, not a Helm hook, so install is not blocked on JuiceFS format.
  lookup skips recreation on upgrade; helm.sh/resource-policy keep prevents
  Helm from deleting the Job when the template is omitted.
*/ -}}
{{- if not (lookup "batch/v1" "Job" (include "kross.namespace" .) "kross-init") }}
apiVersion: batch/v1
kind: Job
metadata:
  name: kross-init
  namespace: {{ include "kross.namespace" . }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
    app.kubernetes.io/component: init
  annotations:
    helm.sh/resource-policy: keep
spec:
  backoffLimit: 8
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: OnFailure
      {{- include "kross.imagePullSecrets" . | nindent 6 }}
      initContainers:
        - name: database
          image: {{ .Values.postgres.image }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: postgres-password
            - name: JFS_DB
              value: {{ .Values.juicefs.metaDatabase | quote }}
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              until pg_isready -h postgres -U kross -d kross >/dev/null 2>&1; do sleep 2; done
              if ! psql -h postgres -U kross -d kross -tAc "SELECT 1 FROM pg_database WHERE datname='${JFS_DB}'" | grep -q 1; then
                psql -h postgres -U kross -d kross -c "CREATE DATABASE ${JFS_DB}"
              fi
      containers:
        - name: format
          image: {{ .Values.juicefs.formatImage }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: JUICEFS_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: s3-access-key
            - name: JUICEFS_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: s3-secret-key
            - name: JUICEFS_BUCKET
              value: {{ printf "http://%s:9000/%s" (include "kross.rustfsFqdn" .) .Values.juicefs.bucket | quote }}
            - name: JUICEFS_VOLUME_NAME
              value: {{ .Values.juicefs.volumeName | quote }}
            - name: JUICEFS_META_URL
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: juicefs-metaurl
            - name: AWS_REGION
              value: us-east-1
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              i=0
              while [ "$i" -lt 60 ]; do
                if juicefs status "${JUICEFS_META_URL}" >/dev/null 2>&1; then
                  exit 0
                fi
                if juicefs format \
                    --storage s3 \
                    --bucket "${JUICEFS_BUCKET}" \
                    --access-key "${JUICEFS_ACCESS_KEY}" \
                    --secret-key "${JUICEFS_SECRET_KEY}" \
                    "${JUICEFS_META_URL}" \
                    "${JUICEFS_VOLUME_NAME}"; then
                  exit 0
                fi
                i=$((i + 1))
                sleep 5
              done
              echo "juicefs format did not succeed" >&2
              exit 1
{{- end }}
