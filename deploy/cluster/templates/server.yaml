apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: {{ include "kross.namespace" . }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  ports:
    - name: http
      port: 8787
      targetPort: 8787
  selector:
    app.kubernetes.io/component: server
    app.kubernetes.io/instance: {{ .Release.Name }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: server
  namespace: {{ include "kross.namespace" . }}
  labels:
    {{- include "kross.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/component: server
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "kross.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: kross-server
      automountServiceAccountToken: true
      {{- include "kross.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.server.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      enableServiceLinks: false
      containers:
        - name: server
          image: {{ include "kross.image" (dict "root" . "image" .Values.images.server) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          env:
            - name: PORT
              value: "8787"
            - name: SERVER_PORT
              value: "8787"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/kross
            - name: SPRING_DATASOURCE_USERNAME
              value: kross
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: postgres-password
            - name: APP_CREDENTIAL_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: credential-master-key
            - name: APP_PUBLIC_BASE_URL
              value: {{ .Values.app.publicBaseUrl | quote }}
            - name: APP_EXTERNAL_BASE_URL
              value: {{ .Values.app.externalBaseUrl | quote }}
            - name: APP_WORKER_IMAGE
              value: {{ include "kross.image" (dict "root" . "image" .Values.images.worker) | quote }}
            - name: APP_WORKER_RUNTIME
              value: {{ .Values.app.workerRuntime | quote }}
            - name: APP_WORKER_STORAGE
              value: {{ .Values.app.workerStorage | quote }}
            - name: APP_KUBERNETES_NAMESPACE
              value: {{ include "kross.namespace" . | quote }}
            - name: APP_KUBERNETES_STORAGE_CLASS
              value: {{ .Values.app.storageClass | quote }}
            - name: APP_KUBERNETES_WORKSPACE_SIZE
              value: {{ .Values.app.workspaceSize | quote }}
            - name: APP_KUBERNETES_IMAGE_PULL_POLICY
              value: {{ .Values.images.pullPolicy | quote }}
            - name: APP_KUBERNETES_IMAGE_PULL_SECRETS
              value: {{ include "kross.imagePullSecretsCsv" . | quote }}
            {{- with .Values.app.workerNodeSelector }}
            - name: APP_KUBERNETES_NODE_SELECTOR
              value: {{ include "kross.nodeSelectorCsv" . | quote }}
            {{- end }}
            - name: APP_AGENT_CPU_MILLIS
              value: {{ .Values.app.agentCpuMillis | quote }}
            - name: APP_AGENT_MEMORY_BYTES
              value: {{ .Values.app.agentMemoryBytes | quote }}
            {{- with .Values.app.schedulerPollMs }}
            - name: APP_SCHEDULER_POLL_MS
              value: {{ . | quote }}
            {{- end }}
            - name: APP_CACHE_ENABLED
              value: {{ .Values.app.cacheEnabled | quote }}
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: APP_S3_ENDPOINT
              value: http://rustfs:9000
            - name: APP_S3_PUBLIC_ENDPOINT
              value: {{ include "kross.s3PublicEndpoint" . | quote }}
            - name: AWS_REQUEST_CHECKSUM_CALCULATION
              value: WHEN_REQUIRED
            - name: AWS_RESPONSE_CHECKSUM_VALIDATION
              value: WHEN_REQUIRED
            - name: APP_S3_BUCKET
              value: kross
            - name: APP_S3_EXTRA_BUCKETS
              value: {{ .Values.juicefs.bucket | quote }}
            - name: APP_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: s3-access-key
            - name: APP_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: kross-secrets
                  key: s3-secret-key
            - name: APP_DEV_IDENTITY
              value: "0"
            {{- if or .Values.ingress.tls (hasPrefix "https://" .Values.app.externalBaseUrl) }}
            - name: APP_SESSION_COOKIE_SECURE
              value: "true"
            {{- end }}
            {{- if .Values.knowledge.enabled }}
            - name: APP_KNOWLEDGE_BASE_URL
              value: http://knowledge:8090
            - name: APP_KNOWLEDGE_INTERNAL_TOKEN
              value: {{ .Values.knowledge.internalToken | quote }}
            {{- end }}
            {{- if .Values.feishu.enabled }}
            - name: APP_FEISHU_ENABLED
              value: "true"
            - name: APP_FEISHU_APP_ID
              value: {{ .Values.feishu.appId | quote }}
            - name: APP_FEISHU_APP_SECRET
              value: {{ .Values.feishu.appSecret | quote }}
            - name: APP_FEISHU_VERIFICATION_TOKEN
              value: {{ .Values.feishu.verificationToken | quote }}
            - name: APP_FEISHU_ENCRYPT_KEY
              value: {{ .Values.feishu.encryptKey | quote }}
            {{- end }}
          ports:
            - containerPort: 8787
          readinessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 20
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8787
            initialDelaySeconds: 40
            periodSeconds: 20
